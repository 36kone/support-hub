[project]
name = "support-hub"
version = "0.1.0"
description = "Support Hub API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "cryptography>=50.0.1",
    "debugpy>=1.8.21",
    "fastapi>=0.141.1",
    "fastapi-cache2>=0.2.2",
    "fastapi-mail>=1.6.8",
    "hatchling>=1.32.0",
    "jinja2>=3.1.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-html>=4.1.0",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.6.0",
    "hatch",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "testcontainers>=4.0.0",
]

[project.scripts]
support-hub = "support_hub:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.hatch.envs.default]
dependency-groups = ["dev"]

[tool.hatch.envs.default.scripts]
fmt = "ruff check --fix . && ruff format ."
# test = "pytest -n 6 -vv -ra --tb=short --durations=20 --cov=app --cov-report=term-missing --html=pytest_report.html --self-contained-html --timeout=120"
test = "pytest -n 6 -vv -x -ra --tb=short --timeout=120"

pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"

