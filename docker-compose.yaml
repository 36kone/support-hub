services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: support_hub
      POSTGRES_USER: support_hub
      POSTGRES_PASSWORD: support_hub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_hub -d support_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://support_hub:support_hub@postgres:5432/support_hub
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-development-secret-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE: 60
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
